<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A Tiny Mandu Surprise</title>
    <meta name="description" content="Open the steamer for a tiny mandu surprise.">
    <link rel="canonical" href="https://jmcwhorter150.github.io/mandu/">
    <meta property="og:title" content="A Tiny Mandu Surprise">
    <meta property="og:description" content="Open the steamer for a tiny mandu surprise.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jmcwhorter150.github.io/mandu/">
    <meta property="og:site_name" content="A Tiny Mandu Surprise">
    <meta property="og:image" content="https://jmcwhorter150.github.io/mandu/assets/og-steamer.png">
    <meta property="og:image:secure_url" content="https://jmcwhorter150.github.io/mandu/assets/og-steamer.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="A closed bamboo steamer for a tiny mandu surprise.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="A Tiny Mandu Surprise">
    <meta name="twitter:description" content="Open the steamer for a tiny mandu surprise.">
    <meta name="twitter:image" content="https://jmcwhorter150.github.io/mandu/assets/og-steamer.png">
    <meta name="twitter:image:alt" content="A closed bamboo steamer for a tiny mandu surprise.">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <h1 id="page-title">A tiny mandu surprise</h1>
          <p class="subtitle">Girl or Boy?</p>
        </div>

        <div class="stage" aria-live="polite">
          <div class="pattern pattern-left" aria-hidden="true"></div>
          <div class="pattern pattern-right" aria-hidden="true"></div>

          <div class="confetti" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="steam" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="steamer" id="steamer">
            <div class="lid" aria-hidden="true">
              <div class="lid-handle"></div>
              <div class="lid-band"></div>
            </div>

            <div class="mandu" aria-hidden="true">
              <img class="mandu-image" src="assets/pink-bao-bun-no-eyes.png" alt="" draggable="false">
              <span class="gaze-eye gaze-left"></span>
              <span class="gaze-eye gaze-right"></span>
              <span class="boop-pop pop-1">♡</span>
              <span class="boop-pop pop-2">✦</span>
              <span class="boop-pop pop-3">♡</span>
            </div>

            <div class="tray">
              <div class="tray-rim"></div>
              <div class="tray-body">
                <span class="slat slat-1"></span>
                <span class="slat slat-2"></span>
                <span class="slat slat-3"></span>
                <span class="slat slat-4"></span>
              </div>
              <div class="tray-foot"></div>
            </div>
          </div>

          <button class="reveal-button" type="button" aria-controls="steamer" aria-expanded="false">
            Open tray
          </button>

          <p class="reveal-message">It's a girl!</p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
